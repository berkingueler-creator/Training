<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Trainingsplan</title>
<style>
:root{
  --bg:#1c1f22;
  --surface:#24282c;
  --surface2:#2b3034;
  --border:#383e43;
  --text:#edeef0;
  --text2:#9aa1a8;
  --good:#5fae7a;
  --accent:#8a8f94;
  --accent-dim:#5c6064;
  --accent-ink:#13161a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
body{padding-bottom:94px;}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  border-bottom:1px solid var(--border);}
header .toprow{display:flex;align-items:center;gap:10px;}
header .back{width:30px;height:30px;border-radius:9px;background:var(--surface);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--text2);flex-shrink:0;}
header .eyebrow{color:var(--accent);font-size:12px;letter-spacing:.04em;margin-bottom:2px;}
header h1{font-size:21px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--text2);font-size:13px;}

nav.tabs{display:flex;gap:6px;margin:14px 18px 4px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:3px;}
nav.tabs button{flex:1;padding:9px 0;border:none;background:transparent;color:var(--text2);
  font-size:14px;border-radius:8px;font-weight:600;}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);}

main{padding:6px 18px 24px;}
section.block{margin-top:22px;}
section.block h2{font-size:13px;color:var(--text2);
  margin:0 0 10px;font-weight:600;letter-spacing:.02em;border-left:3px solid var(--accent);
  padding-left:8px;}

/* Home day cards */
.daycard{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-left:4px solid var(--dayaccent);border-radius:12px;
  padding:16px;margin-bottom:12px;}
.daycard .eyebrow{color:var(--dayaccent);font-size:12px;letter-spacing:.04em;margin-bottom:4px;font-weight:600;}
.daycard .name{font-size:17px;font-weight:700;margin-bottom:5px;}
.daycard .desc{color:var(--text2);font-size:13px;line-height:1.4;}
.daycard .arrow{float:right;color:var(--text2);font-size:18px;}

.checklist label{display:flex;align-items:center;gap:10px;padding:9px 4px;
  border-bottom:1px solid var(--border);font-size:14.5px;}
.checklist label:last-child{border-bottom:none;}
.checklist input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);}
.checklist span.note{color:var(--text2);font-size:12.5px;margin-left:auto;text-align:right;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  margin-bottom:12px;overflow:hidden;}
.card .head{padding:13px 14px 10px;}
.card .head .name{font-size:15.5px;font-weight:650;}
.card .head .equip{color:var(--accent);font-size:12.5px;margin-top:3px;}
.card .head .target{color:var(--text2);font-size:12px;margin-top:5px;}
.card .rows{padding:0 14px 12px;}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:8px;align-items:center;
  margin-top:8px;}
.setrow .idx{color:var(--text2);font-size:13px;text-align:center;}
.setrow input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;padding:8px 6px;text-align:center;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;}
.setrow .del{color:var(--text2);font-size:18px;text-align:center;}
.card .foot{display:flex;gap:8px;padding:10px 14px 14px;}
.addset{flex:1;background:var(--surface2);border:1px dashed var(--border);color:var(--text2);
  border-radius:8px;padding:9px;font-size:13px;}
.timerbtn{background:var(--accent-dim);border:none;color:var(--text);border-radius:8px;
  padding:9px 14px;font-size:13px;min-width:78px;font-weight:600;}
.timerbtn.running{background:var(--accent);color:var(--accent-ink);}

.cardiocard{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px;}
.cardiocard .desc{font-size:13.5px;color:var(--text2);line-height:1.5;margin-bottom:10px;}
.cardiocard .row{display:flex;gap:10px;}
.cardiocard input{flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;padding:9px;text-align:center;}
.cardiocard label.small{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}

footer.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);
  display:none;gap:10px;z-index:20;}
footer.bar.show{display:flex;}
.savebtn{flex:1;background:var(--accent);color:var(--accent-ink);border:none;border-radius:11px;
  padding:14px;font-size:15.5px;font-weight:700;}
.savebtn:active{opacity:.85;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--good);color:#0e1416;padding:9px 16px;border-radius:20px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;
  z-index:30;}
.toast.show{opacity:1;}

/* History */
.chiprow{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--text2);
  font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.histsession{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:12px;border-left:4px solid var(--rowaccent);}
.histsession .date{font-weight:650;font-size:14.5px;}
.histsession .daytag{color:var(--rowaccent);font-size:11.5px;font-weight:700;
  letter-spacing:.03em;margin-bottom:3px;}
.histsession .exline{display:flex;justify-content:space-between;font-size:13px;
  color:var(--text2);padding:5px 0;border-top:1px solid var(--border);margin-top:7px;}
.histsession .exline b{color:var(--text);font-weight:600;}
.empty{color:var(--text2);font-size:13.5px;text-align:center;padding:40px 10px;}

/* Info */
.infocard{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px;}
.inforow{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:14px;}
.inforow:last-child{border-bottom:none;}
.inforow span.k{color:var(--text2);}
.inforow span.v{font-weight:600;}
.infonote{color:var(--text2);font-size:12.5px;line-height:1.6;margin-top:14px;}
</style>
</head>
<body>

<header id="header"></header>
<nav class="tabs" id="toptabs">
  <button id="tabStartBtn" class="active">Start</button>
  <button id="tabHistBtn">Verlauf</button>
  <button id="tabInfoBtn">Info</button>
</nav>

<main id="main"></main>

<footer class="bar" id="footerBar">
  <button class="savebtn" id="saveBtn">Einheit speichern</button>
</footer>
<div class="toast" id="toast">Gespeichert ✓</div>

<script>
const APP_VERSION = '1.1.0';
const DEVELOPER = 'Berkin';
const BUILD_DATE = '2026-09-05';

const DATA = {
  A: {

      {id:'lz', name:'Latzug breiter Griff', equip:'Ersatz: Kabelturm – Lat-Rückenzug von oben (Gerät B5)', target:'3 Sätze × 8–10 Wdh · Pause 90 Sek', sets:3, rest:90, unit:'Wdh'},
      {id:'rs', name:'Rudern sitzend', equip:'Kabelturm – tiefe Umlenkrolle, V-Griff', target:'3 Sätze × 10–12 Wdh · Pause 90 Sek', sets:3, rest:90, unit:'Wdh'},
      {id:'rk', name:'Rumänisches Kreuzheben', equip:'Freihantelbereich – Kurz- oder Langhantel', target:'3 Sätze × 8–10 Wdh · Pause 2 Min', sets:3, rest:120, unit:'Wdh'},
      {id:'bp', name:'Beinpresse', equip:'Ersatz: Cybex Eagle Leg Press (alt. Funktionsstemme R6-sl)', target:'3 Sätze × 10–12 Wdh · Pause 90 Sek', sets:3, rest:90, unit:'Wdh'},
      {id:'rex', name:'Rückenstrecker', equip:'Ersatz: Extensionstrainer großer Rückenstrecker (Gerät R14)', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
      {id:'pl', name:'Plank', equip:'Matte, Unterarmstütz', target:'3 Sätze × 45–60 Sek · Pause 60 Sek', sets:3, rest:60, unit:'Sek'},
      {id:'llr', name:'Lying Leg Raise (optional)', equip:'Ersatz: Gerät R3 – Hüftbeuger/Rumpf', target:'2 Sätze × 12–15 Wdh · Pause 60 Sek', sets:2, rest:60, unit:'Wdh'},
    ],
    cardio:{title:'Cardio-Finisher', desc:'Rudergerät Intervall: 30 Sek Sprint (Zone 4) / 90 Sek locker (Zone 2), 6–8 Runden.', unit:'Runden'},
  },
  B: {
    key:'B', label:'Einheit B', eyebrow:'Mittwoch', title:'Schultern, Brust & Arme',
    desc:'Schulterpresse, Face Pulls, Bankdrücken, Schrägbank, Bizeps/Trizeps-Supersatz.',
    accent:'#c98a3d', accentDim:'#8f632c', ink:'#191008',
    warmup:[
      {t:'Fahrrad 5 Min mittleres Tempo (Zone 2)'},
      {t:'Arm Circles', n:'15×/Richtung'},
      {t:'Wall Slides', n:'10 Wdh.'},
    ],
    cooldown:[
      {t:'Chest Stretch (Türrahmen)', n:'30 Sek/Seite'},
      {t:'Shoulder Stretch', n:'30 Sek/Seite'},
      {t:'Trizeps Stretch', n:'30 Sek/Seite'},
    ],
    exercises:[
      {id:'sp', name:'Schulterdrücken', equip:'Ersatz: Schulterpresse Kombinierte Seated-Press (Gerät R21)', target:'3 Sätze × 8–10 Wdh · Pause 2 Min', sets:3, rest:120, unit:'Wdh'},
      {id:'sh', name:'Seitheben', equip:'Freihantelbereich – Kurzhanteln, leicht wählen', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
      {id:'fp', name:'Face Pulls', equip:'Ersatz: Überzug-/Fronthebe-Station (Gerät R19)', target:'3 Sätze × 15–20 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
      {id:'bd', name:'Bankdrücken', equip:'Freihantelbereich – Bank + Langhantel (alt. Brust-Presse R20)', target:'3 Sätze × 8–10 Wdh · Pause 2 Min', sets:3, rest:120, unit:'Wdh'},
      {id:'sb', name:'Schrägbankdrücken', equip:'Freihantelbereich – Kurzhanteln (alt. Butterfly-vorwärts A8)', target:'3 Sätze × 10–12 Wdh · Pause 90 Sek', sets:3, rest:90, unit:'Wdh'},
      {id:'bc', name:'Bizeps-Curls', equip:'Freihantelbereich – Kurzhanteln (Supersatz mit Trizeps-Drücken)', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:0, unit:'Wdh'},
      {id:'td', name:'Trizeps-Drücken', equip:'Ersatz: Stützstemme-Dips Trizepstrainer (Gerät A4)', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
    ],
    cardio:{title:'Cardio-Finisher', desc:'Fahrrad Steady-State, 15 Min, Zone 2–3 – gleichmäßiges Tempo, noch sprechfähig.', unit:'Minuten'},
  },
  C: {
    key:'C', label:'Einheit C', eyebrow:'Freitag', title:'Ganzkörper Compound + HIIT',
    desc:'Kniebeugen, assistierte Klimmzüge, Ausfallschritte, Rudern – plus HIIT-Finisher.',
    accent:'#c15a34', accentDim:'#873f26', ink:'#1a0f09',
    warmup:[
      {t:'Rudergerät 5 Min leicht bis mittel (Zone 2)'},
      {t:'Leg Swings', n:'10×/Seite'},
      {t:'Arm Swings', n:'10×/Richtung'},
      {t:'Torso Rotation', n:'10×/Seite'},
    ],
    cooldown:[
      {t:'Quadriceps Stretch', n:'30 Sek/Seite'},
      {t:'Hamstring Stretch', n:'30 Sek/Seite'},
      {t:'Lat Stretch', n:'30 Sek/Seite'},
      {t:'Chest Stretch', n:'30 Sek/Seite'},
    ],
    exercises:[
      {id:'ks', name:'Kniebeugen', equip:'Freihantelbereich (alt. bei Rückenbelastung: Cybex Eagle Leg Press)', target:'3 Sätze × 8–10 Wdh · Pause 2–3 Min', sets:3, rest:150, unit:'Wdh'},
      {id:'kz', name:'Klimmzüge (assistiert)', equip:'Ersatz: Dip-Chin Assist Maschine', target:'3 Sätze × 6–10 Wdh · Pause 2 Min', sets:3, rest:120, unit:'Wdh'},
      {id:'af', name:'Ausfallschritte', equip:'Freihantelbereich – Kurzhanteln', target:'3 Sätze × 10 Wdh/Bein · Pause 90 Sek', sets:3, rest:90, unit:'Wdh/Bein'},
      {id:'er', name:'Einarmiges Rudern', equip:'Freihantelbereich – Kurzhantel + Bank', target:'3 Sätze × 10 Wdh/Arm · Pause 90 Sek', sets:3, rest:90, unit:'Wdh/Arm'},
      {id:'pu', name:'Push-Ups', equip:'Matte', target:'3 Sätze × 12–20 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
      {id:'rt', name:'Russian Twists', equip:'Matte – Kurzhantel oder Kettlebell', target:'3 Sätze × 15 Wdh/Seite · Pause 60 Sek', sets:3, rest:60, unit:'Wdh/Seite'},
      {id:'ad', name:'Hüft Ab-/Adduktion (optional)', equip:'Technogym Abductor/Adductor Maschine', target:'2 Sätze × 15 Wdh/Seite · Pause 45 Sek', sets:2, rest:45, unit:'Wdh'},
    ],
    cardio:{title:'HIIT-Cardio', desc:'Rudergerät oder Fahrrad: 20 Sek All-Out (Zone 5) / 40 Sek locker (Zone 2), 10–12 Runden.', unit:'Runden'},
  },
};

function fmtDate(d){
  return d.toLocaleDateString('de-DE',{weekday:'long', day:'2-digit', month:'long'});
}
function fmtTime(s){
  const m=Math.floor(s/60), r=s%60;
  return m+':'+String(r).padStart(2,'0');
}

// ---------- routing ----------
let route = {tab:'start', day:null};
let timerInterval = null;

function setAccent(day){
  const d = day ? DATA[day] : null;
  document.documentElement.style.setProperty('--accent', d ? d.accent : '#8a8f94');
  document.documentElement.style.setProperty('--accent-dim', d ? d.accentDim : '#5c6064');
  document.documentElement.style.setProperty('--accent-ink', d ? d.ink : '#13161a');
}

function renderHeader(){
  const h = document.getElementById('header');
  if(route.tab==='start' && route.day){
    const d = DATA[route.day];
    h.innerHTML = `
      <div class="toprow">
        <div class="back" id="backBtn">‹</div>
        <div>
          <div class="eyebrow">${d.eyebrow.toUpperCase()} · ${d.label.toUpperCase()}</div>
          <h1 style="font-size:19px;">${d.title}</h1>
        </div>
      </div>
      <div class="sub">${fmtDate(new Date())}</div>`;
    document.getElementById('backBtn').onclick = ()=>{ route.day=null; renderAll(); };
  } else if(route.tab==='start'){
    h.innerHTML = `<div class="eyebrow">TRAININGSPLAN</div><h1>Wähle deine Einheit</h1><div class="sub">${fmtDate(new Date())}</div>`;
  } else if(route.tab==='history'){
    h.innerHTML = `<div class="eyebrow">TRAININGSPLAN</div><h1>Trainingsverlauf</h1><div class="sub">Alle gespeicherten Einheiten</div>`;
  } else if(route.tab==='info'){
    h.innerHTML = `<div class="eyebrow">TRAININGSPLAN</div><h1>Info</h1><div class="sub">App-Version &amp; Details</div>`;
  }
}

function renderTabs(){
  document.getElementById('tabStartBtn').classList.toggle('active', route.tab==='start');
  document.getElementById('tabHistBtn').classList.toggle('active', route.tab==='history');
  document.getElementById('tabInfoBtn').classList.toggle('active', route.tab==='info');
}

function renderAll(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  setAccent(route.tab==='start' ? route.day : null);
  renderHeader();
  renderTabs();
  const footer = document.getElementById('footerBar');
  footer.classList.toggle('show', route.tab==='start' && !!route.day);
  if(route.tab==='start' && !route.day) renderHome();
  else if(route.tab==='start' && route.day) renderDay(route.day);
  else if(route.tab==='history') renderHistory();
  else if(route.tab==='info') renderInfo();
}

// ---------- home ----------
function renderHome(){
  const main = document.getElementById('main');
  main.innerHTML = Object.values(DATA).map(d=>`
    <button class="daycard" style="--dayaccent:${d.accent}" data-day="${d.key}">
      <span class="arrow">›</span>
      <div class="eyebrow">${d.eyebrow} · ${d.label}</div>
      <div class="name">${d.title}</div>
      <div class="desc">${d.desc}</div>
    </button>`).join('');
  main.querySelectorAll('.daycard').forEach(btn=>{
    btn.onclick = ()=>{ route.day = btn.dataset.day; renderAll(); };
  });
}

// ---------- day training view ----------
function setRowHtml(idx, w, r, unit){
  return `<div class="setrow" data-idx="${idx}">
    <div class="idx">${idx+1}</div>
    <input type="number" inputmode="decimal" placeholder="kg" class="wIn" value="${w||''}">
    <input type="number" inputmode="numeric" placeholder="${unit}" class="rIn" value="${r||''}">
    <div class="del" data-action="del">✕</div>
  </div>`;
}

function loadPrefill(dayKey){
  try{
    const raw = localStorage.getItem('prefill_'+dayKey);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function renderDay(dayKey){
  const d = DATA[dayKey];
  const main = document.getElementById('main');
  const prefill = loadPrefill(dayKey);

  main.innerHTML = `
    <section class="block" style="margin-top:8px;">
      <h2>Warm-up</h2>
      <div class="checklist" id="warmup"></div>
    </section>
    <section class="block">
      <h2>Hauptteil · Kraft</h2>
      <div id="exercises"></div>
    </section>
    <section class="block">
      <h2>${d.cardio.title}</h2>
      <div class="cardiocard">
        <div class="desc">${d.cardio.desc}</div>
        <div class="row">
          <div><label class="small">${d.cardio.unit}</label>
            <input type="number" id="cardioRounds" inputmode="numeric" placeholder="–"></div>
          <div><label class="small">Gefühl (1–10)</label>
            <input type="number" id="cardioRpe" inputmode="numeric" placeholder="–"></div>
        </div>
      </div>
    </section>
    <section class="block">
      <h2>Cool-down</h2>
      <div class="checklist" id="cooldown"></div>
    </section>`;

  const renderChecklist = (el, items)=>{
    el.innerHTML = items.map((it,i)=>`
      <label><input type="checkbox" data-i="${i}"><span>${it.t}</span>
      ${it.n?`<span class="note">${it.n}</span>`:''}</label>`).join('');
  };
  renderChecklist(document.getElementById('warmup'), d.warmup);
  renderChecklist(document.getElementById('cooldown'), d.cooldown);

  const exWrap = document.getElementById('exercises');
  d.exercises.forEach(ex=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.ex = ex.id;
    const initialSets = (prefill[ex.id] && prefill[ex.id].length) ? prefill[ex.id] : Array.from({length:ex.sets},()=>({w:'',r:''}));
    card.innerHTML = `
      <div class="head">
        <div class="name">${ex.name}</div>
        <div class="equip">${ex.equip}</div>
        <div class="target">${ex.target}</div>
      </div>
      <div class="rows">${initialSets.map((s,i)=>setRowHtml(i,'', '', ex.unit)).join('')}</div>
      <div class="foot">
        <button class="addset" data-action="add">+ Satz</button>
        <button class="timerbtn" data-action="timer" data-rest="${ex.rest||60}">Pause ${ex.rest||60}s</button>
      </div>`;
    exWrap.appendChild(card);
  });

  function startTimer(btn, seconds){
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    document.querySelectorAll('.timerbtn.running').forEach(b=>{
      b.classList.remove('running'); b.textContent = 'Pause '+b.dataset.rest+'s';
    });
    let remaining = seconds;
    btn.classList.add('running');
    btn.textContent = fmtTime(remaining);
    timerInterval = setInterval(()=>{
      remaining--;
      if(remaining<=0){
        clearInterval(timerInterval); timerInterval=null;
        btn.classList.remove('running');
        btn.textContent = 'Pause '+btn.dataset.rest+'s';
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      } else { btn.textContent = fmtTime(remaining); }
    },1000);
  }

  exWrap.addEventListener('click', (e)=>{
    const action = e.target.dataset.action;
    if(!action) return;
    const card = e.target.closest('.card');
    const exId = card.dataset.ex;
    const ex = d.exercises.find(x=>x.id===exId);
    if(action==='add'){
      const rows = card.querySelector('.rows');
      const idx = rows.children.length;
      rows.insertAdjacentHTML('beforeend', setRowHtml(idx, '', '', ex.unit));
    }
    if(action==='del'){
      const row = e.target.closest('.setrow');
      row.remove();
      card.querySelectorAll('.setrow').forEach((r,i)=>{ r.dataset.idx=i; r.querySelector('.idx').textContent=i+1; });
    }
    if(action==='timer'){ startTimer(e.target, parseInt(e.target.dataset.rest,10)); }
  });

  document.getElementById('saveBtn').onclick = ()=>{
    const exercisesData = {};
    const prefillOut = {};
    exWrap.querySelectorAll('.card').forEach(card=>{
      const exId = card.dataset.ex;
      const sets = [];
      card.querySelectorAll('.setrow').forEach(row=>{
        sets.push({w: row.querySelector('.wIn').value, r: row.querySelector('.rIn').value});
      });
      exercisesData[exId] = sets;
      prefillOut[exId] = sets;
    });
    const session = {
      day: dayKey,
      date: new Date().toISOString(),
      dateLabel: fmtDate(new Date()),
      exercises: exercisesData,
      cardioRounds: document.getElementById('cardioRounds').value,
      cardioRpe: document.getElementById('cardioRpe').value,
    };
    try{
      const raw = localStorage.getItem('sessions_'+dayKey);
      const sessions = raw ? JSON.parse(raw) : [];
      sessions.push(session);
      localStorage.setItem('sessions_'+dayKey, JSON.stringify(sessions));
      localStorage.setItem('prefill_'+dayKey, JSON.stringify(prefillOut));
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'), 1800);
    }catch(e){
      alert('Speichern fehlgeschlagen. Bitte erneut versuchen.');
    }
  };
}

// ---------- history (across all days) ----------
let histFilter = 'all';
function renderHistory(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="block" style="margin-top:8px;">
      <div class="chiprow" id="histChips"></div>
      <div id="histList"></div>
    </section>`;
  const chips = document.getElementById('histChips');
  const options = [{k:'all', label:'Alle'}, {k:'A', label:'Einheit A'}, {k:'B', label:'Einheit B'}, {k:'C', label:'Einheit C'}];
  chips.innerHTML = options.map(o=>`<div class="chip ${histFilter===o.k?'active':''}" data-k="${o.k}">${o.label}</div>`).join('');
  chips.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{ histFilter = c.dataset.k; renderHistory(); };
  });

  let all = [];
  ['A','B','C'].forEach(k=>{
    try{
      const raw = localStorage.getItem('sessions_'+k);
      const sessions = raw ? JSON.parse(raw) : [];
      sessions.forEach(s=> all.push(Object.assign({day:k}, s)));
    }catch(e){}
  });
  if(histFilter!=='all') all = all.filter(s=>s.day===histFilter);
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));

  const list = document.getElementById('histList');
  if(!all.length){ list.innerHTML = '<div class="empty">Noch keine gespeicherten Einheiten.</div>'; return; }

  list.innerHTML = all.slice(0,20).map(s=>{
    const d = DATA[s.day];
    const exLines = Object.entries(s.exercises||{}).map(([exId, sets])=>{
      const ex = d.exercises.find(x=>x.id===exId);
      if(!ex || !sets.length) return '';
      const best = sets.filter(x=>x.w||x.r).map(x=>`${x.w||'–'}kg×${x.r||'–'}`).join(', ');
      if(!best) return '';
      return `<div class="exline"><b>${ex.name}</b><span>${best}</span></div>`;
    }).join('');
    return `<div class="histsession" style="--rowaccent:${d.accent}">
      <div class="daytag">${d.label.toUpperCase()}</div>
      <div class="date">${s.dateLabel}</div>
      ${exLines || '<div class="exline"><span>Keine Sätze protokolliert</span></div>'}
    </div>`;
  }).join('');
}
