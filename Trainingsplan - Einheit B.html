<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Einheit B">
<title>Einheit B – Schultern &amp; Brust</title>
<style>
:root{
  --bg:#1c1f22;
  --surface:#24282c;
  --surface2:#2b3034;
  --border:#383e43;
  --text:#edeef0;
  --text2:#9aa1a8;
  --accent:#c98a3d;
  --accent-dim:#8f632c;
  --good:#5fae7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
body{padding-bottom:90px;}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  border-bottom:1px solid var(--border);}
header .eyebrow{color:var(--accent);font-size:12px;letter-spacing:.04em;margin-bottom:2px;}
header h1{font-size:21px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--text2);font-size:13px;}
nav.tabs{display:flex;gap:6px;margin:14px 18px 4px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:3px;}
nav.tabs button{flex:1;padding:9px 0;border:none;background:transparent;color:var(--text2);
  font-size:14px;border-radius:8px;font-weight:600;}
nav.tabs button.active{background:var(--accent);color:#191008;}
main{padding:6px 18px 24px;}
section.block{margin-top:22px;}
section.block h2{font-size:13px;color:var(--text2);
  margin:0 0 10px;font-weight:600;letter-spacing:.02em;border-left:3px solid var(--accent);
  padding-left:8px;}
.checklist label{display:flex;align-items:center;gap:10px;padding:9px 4px;
  border-bottom:1px solid var(--border);font-size:14.5px;}
.checklist label:last-child{border-bottom:none;}
.checklist input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);}
.checklist span.note{color:var(--text2);font-size:12.5px;margin-left:auto;text-align:right;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  margin-bottom:12px;overflow:hidden;}
.card .head{padding:13px 14px 10px;}
.card .head .name{font-size:15.5px;font-weight:650;}
.card .head .equip{color:var(--accent);font-size:12.5px;margin-top:3px;}
.card .head .target{color:var(--text2);font-size:12px;margin-top:5px;}
.card .rows{padding:0 14px 12px;}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:8px;align-items:center;
  margin-top:8px;}
.setrow .idx{color:var(--text2);font-size:13px;text-align:center;}
.setrow input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;padding:8px 6px;text-align:center;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;}
.setrow .del{color:var(--text2);font-size:18px;text-align:center;}
.card .foot{display:flex;gap:8px;padding:10px 14px 14px;}
.addset{flex:1;background:var(--surface2);border:1px dashed var(--border);color:var(--text2);
  border-radius:8px;padding:9px;font-size:13px;}
.timerbtn{background:var(--accent-dim);border:none;color:var(--text);border-radius:8px;
  padding:9px 14px;font-size:13px;min-width:78px;font-weight:600;}
.timerbtn.running{background:var(--accent);color:#191008;}

.cardiocard{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px;}
.cardiocard .desc{font-size:13.5px;color:var(--text2);line-height:1.5;margin-bottom:10px;}
.cardiocard .row{display:flex;gap:10px;}
.cardiocard input{flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:15px;padding:9px;text-align:center;}
.cardiocard label.small{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}

footer.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;gap:10px;z-index:20;}
.savebtn{flex:1;background:var(--accent);color:#191008;border:none;border-radius:11px;
  padding:14px;font-size:15.5px;font-weight:700;}
.savebtn:active{opacity:.85;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--good);color:#0e1416;padding:9px 16px;border-radius:20px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}

.histsession{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:12px;}
.histsession .date{font-weight:650;font-size:14.5px;}
.histsession .exline{display:flex;justify-content:space-between;font-size:13px;
  color:var(--text2);padding:5px 0;border-top:1px solid var(--border);margin-top:7px;}
.histsession .exline b{color:var(--text);font-weight:600;}
.empty{color:var(--text2);font-size:13.5px;text-align:center;padding:40px 10px;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">MITTWOCH · EINHEIT B</div>
  <h1>Schultern, Brust &amp; Arme</h1>
  <div class="sub" id="dateline"></div>
</header>

<nav class="tabs">
  <button id="tabTrainBtn" class="active">Training</button>
  <button id="tabHistBtn">Verlauf</button>
</nav>

<main>
  <div id="viewTrain">
    <section class="block">
      <h2>Warm-up · 10 Min</h2>
      <div class="checklist" id="warmup"></div>
    </section>

    <section class="block">
      <h2>Hauptteil · Kraft</h2>
      <div id="exercises"></div>
    </section>

    <section class="block">
      <h2>Cardio-Finisher</h2>
      <div class="cardiocard">
        <div class="desc">Fahrrad Steady-State, 15 Min, Zone 2–3 – gleichmäßiges Tempo, noch sprechfähig.</div>
        <div class="row">
          <div>
            <label class="small">Minuten</label>
            <input type="number" id="cardioRounds" inputmode="numeric" placeholder="–">
          </div>
          <div>
            <label class="small">Gefühl (1–10)</label>
            <input type="number" id="cardioRpe" inputmode="numeric" placeholder="–">
          </div>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Cool-down · 5 Min</h2>
      <div class="checklist" id="cooldown"></div>
    </section>
  </div>

  <div id="viewHist" style="display:none;">
    <section class="block" style="margin-top:8px;">
      <h2>Letzte Einheiten</h2>
      <div id="histList"></div>
    </section>
  </div>
</main>

<footer class="bar">
  <button class="savebtn" id="saveBtn">Einheit speichern</button>
</footer>
<div class="toast" id="toast">Gespeichert ✓</div>

<script>
const DAY_ID = 'B';

const WARMUP = [
  {t:'Fahrrad 5 Min mittleres Tempo (Zone 2)'},
  {t:'Arm Circles', n:'15×/Richtung'},
  {t:'Wall Slides', n:'10 Wdh.'},
];
const COOLDOWN = [
  {t:'Chest Stretch (Türrahmen)', n:'30 Sek/Seite'},
  {t:'Shoulder Stretch', n:'30 Sek/Seite'},
  {t:'Trizeps Stretch', n:'30 Sek/Seite'},
];

const EXERCISES = [
  {id:'sp', name:'Schulterdrücken', equip:'Ersatz: Schulterpresse Kombinierte Seated-Press (Gerät R21) – Schulterdrück-Übung', target:'3 Sätze × 8–10 Wdh · Pause 2 Min', sets:3, rest:120, unit:'Wdh'},
  {id:'sh', name:'Seitheben', equip:'Freihantelbereich – Kurzhanteln, leicht wählen', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
  {id:'fp', name:'Face Pulls', equip:'Ersatz: Überzug-/Fronthebe-Station (Gerät R19), Schulterhebe-Übung', target:'3 Sätze × 15–20 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
  {id:'bd', name:'Bankdrücken', equip:'Freihantelbereich – Bank + Langhantel (alt. Seated Press Brust-Presse, Gerät R20)', target:'3 Sätze × 8–10 Wdh · Pause 2 Min', sets:3, rest:120, unit:'Wdh'},
  {id:'sb', name:'Schrägbankdrücken', equip:'Freihantelbereich – Kurzhanteln (alt. Butterfly-vorwärts, Gerät A8)', target:'3 Sätze × 10–12 Wdh · Pause 90 Sek', sets:3, rest:90, unit:'Wdh'},
  {id:'bc', name:'Bizeps-Curls', equip:'Freihantelbereich – Kurzhanteln (Supersatz mit Trizeps-Drücken)', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:0, unit:'Wdh'},
  {id:'td', name:'Trizeps-Drücken', equip:'Ersatz: Stützstemme-Dips Trizepstrainer (Gerät A4) – direkt nach Bizeps-Curls, dann Pause', target:'3 Sätze × 12–15 Wdh · Pause 60 Sek', sets:3, rest:60, unit:'Wdh'},
];

function fmtDate(d){
  return d.toLocaleDateString('de-DE',{weekday:'long', day:'2-digit', month:'long'});
}
document.getElementById('dateline').textContent = fmtDate(new Date());

function renderChecklist(el, items){
  el.innerHTML = items.map((it,i)=>`
    <label>
      <input type="checkbox" data-i="${i}">
      <span>${it.t}</span>
      ${it.n?`<span class="note">${it.n}</span>`:''}
    </label>`).join('');
}
renderChecklist(document.getElementById('warmup'), WARMUP);
renderChecklist(document.getElementById('cooldown'), COOLDOWN);

const exWrap = document.getElementById('exercises');

async function loadPrefill(){
  try{
    const res = await window.storage.get('prefill:'+DAY_ID, false);
    return res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ return {}; }
}

function setRowHtml(exId, idx, w, r, unit){
  return `<div class="setrow" data-ex="${exId}" data-idx="${idx}">
    <div class="idx">${idx+1}</div>
    <input type="number" inputmode="decimal" placeholder="kg" class="wIn" value="${w||''}">
    <input type="number" inputmode="numeric" placeholder="${unit}" class="rIn" value="${r||''}">
    <div class="del" data-action="del">✕</div>
  </div>`;
}

function renderExercise(ex, prefill){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.ex = ex.id;
  const initialSets = (prefill[ex.id] && prefill[ex.id].length) ? prefill[ex.id] : Array.from({length:ex.sets},()=>({w:'',r:''}));
  card.innerHTML = `
    <div class="head">
      <div class="name">${ex.name}</div>
      <div class="equip">${ex.equip}</div>
      <div class="target">${ex.target}</div>
    </div>
    <div class="rows">${initialSets.map((s,i)=>setRowHtml(ex.id,i,'', '', ex.unit)).join('')}</div>
    <div class="foot">
      <button class="addset" data-action="add">+ Satz</button>
      <button class="timerbtn" data-action="timer" data-rest="${ex.rest||60}">Pause ${ex.rest||60}s</button>
    </div>
  `;
  exWrap.appendChild(card);
}

let timerInterval = null;
function startTimer(btn, seconds){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  document.querySelectorAll('.timerbtn.running').forEach(b=>{
    b.classList.remove('running'); b.textContent = 'Pause '+b.dataset.rest+'s';
  });
  let remaining = seconds;
  btn.classList.add('running');
  btn.textContent = fmtTime(remaining);
  timerInterval = setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(timerInterval); timerInterval=null;
      btn.classList.remove('running');
      btn.textContent = 'Pause '+btn.dataset.rest+'s';
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    } else {
      btn.textContent = fmtTime(remaining);
    }
  },1000);
}
function fmtTime(s){
  const m=Math.floor(s/60), r=s%60;
  return m+':'+String(r).padStart(2,'0');
}

exWrap.addEventListener('click', (e)=>{
  const action = e.target.dataset.action;
  if(!action) return;
  const card = e.target.closest('.card');
  const exId = card.dataset.ex;
  if(action==='add'){
    const rows = card.querySelector('.rows');
    const idx = rows.children.length;
    const ex = EXERCISES.find(x=>x.id===exId);
    rows.insertAdjacentHTML('beforeend', setRowHtml(exId, idx, '', '', ex.unit));
  }
  if(action==='del'){
    const row = e.target.closest('.setrow');
    row.remove();
    const rows = card.querySelectorAll('.setrow');
    rows.forEach((r,i)=>{ r.dataset.idx=i; r.querySelector('.idx').textContent=i+1; });
  }
  if(action==='timer'){
    startTimer(e.target, parseInt(e.target.dataset.rest,10));
  }
});

loadPrefill().then(prefill=>{
  EXERCISES.forEach(ex=>renderExercise(ex, prefill));
});

const tabTrainBtn = document.getElementById('tabTrainBtn');
const tabHistBtn = document.getElementById('tabHistBtn');
const viewTrain = document.getElementById('viewTrain');
const viewHist = document.getElementById('viewHist');
tabTrainBtn.onclick = ()=>{
  tabTrainBtn.classList.add('active'); tabHistBtn.classList.remove('active');
  viewTrain.style.display='block'; viewHist.style.display='none';
};
tabHistBtn.onclick = ()=>{
  tabHistBtn.classList.add('active'); tabTrainBtn.classList.remove('active');
  viewTrain.style.display='none'; viewHist.style.display='block';
  loadHistory();
};

async function loadHistory(){
  const list = document.getElementById('histList');
  list.innerHTML = '<div class="empty">Lädt…</div>';
  try{
    const res = await window.storage.get('sessions:'+DAY_ID, false);
    const sessions = res && res.value ? JSON.parse(res.value) : [];
    if(!sessions.length){ list.innerHTML = '<div class="empty">Noch keine gespeicherten Einheiten.</div>'; return; }
    list.innerHTML = sessions.slice().reverse().slice(0,10).map(s=>{
      const exLines = Object.entries(s.exercises||{}).map(([exId, sets])=>{
        const ex = EXERCISES.find(x=>x.id===exId);
        if(!ex || !sets.length) return '';
        const best = sets.filter(x=>x.w||x.r).map(x=>`${x.w||'–'}kg×${x.r||'–'}`).join(', ');
        if(!best) return '';
        return `<div class="exline"><b>${ex.name}</b><span>${best}</span></div>`;
      }).join('');
      return `<div class="histsession">
        <div class="date">${s.dateLabel}</div>
        ${exLines || '<div class="exline"><span>Keine Sätze protokolliert</span></div>'}
      </div>`;
    }).join('');
  }catch(e){
    list.innerHTML = '<div class="empty">Verlauf konnte nicht geladen werden.</div>';
  }
}

document.getElementById('saveBtn').onclick = async ()=>{
  const exercisesData = {};
  const prefill = {};
  document.querySelectorAll('#exercises .card').forEach(card=>{
    const exId = card.dataset.ex;
    const sets = [];
    card.querySelectorAll('.setrow').forEach(row=>{
      const w = row.querySelector('.wIn').value;
      const r = row.querySelector('.rIn').value;
      sets.push({w, r});
    });
    exercisesData[exId] = sets;
    prefill[exId] = sets;
  });
  const session = {
    date: new Date().toISOString(),
    dateLabel: fmtDate(new Date()),
    exercises: exercisesData,
    cardioRounds: document.getElementById('cardioRounds').value,
    cardioRpe: document.getElementById('cardioRpe').value,
    warmupDone: Array.from(document.querySelectorAll('#warmup input:checked')).length,
    cooldownDone: Array.from(document.querySelectorAll('#cooldown input:checked')).length,
  };
  try{
    const res = await window.storage.get('sessions:'+DAY_ID, false);
    const sessions = res && res.value ? JSON.parse(res.value) : [];
    sessions.push(session);
    await window.storage.set('sessions:'+DAY_ID, JSON.stringify(sessions), false);
    await window.storage.set('prefill:'+DAY_ID, JSON.stringify(prefill), false);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  }catch(e){
    alert('Speichern fehlgeschlagen. Bitte erneut versuchen.');
  }
};
</script>
</body>
</html>
